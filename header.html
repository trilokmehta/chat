<header class="sticky top-0 z-50 w-full">
  <div class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex h-16 items-center justify-between gap-4">
        <a class="flex shrink-0 items-center gap-2.5" href="#">
          <i class="fas fa-layer-group text-3xl text-gold"></i>
          <div class="flex flex-col leading-tight">
            <div class="flex items-baseline">
              <span
                class="font-heading text-xl font-extrabold text-gray-900 tracking-tight"
                >Science</span
              >
              <span
                class="font-heading text-xl font-extrabold text-orange-500 tracking-tight"
                >Edge</span
              >
            </div>
            <span
              class="rounded border border-gray-300 px-1 py-px text-[8px] font-bold uppercase tracking-[0.12em] text-gray-500 w-fit"
              >Civil Services</span
            >
          </div>
        </a>

        <div class="hidden flex-1 items-center justify-center xl:flex">
          <div class="flex flex-wrap items-center justify-center gap-2">
            <a
              class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-gray-700 hover:text-orange-500"
              href="#"
              ><i class="fas fa-home"></i> Home</a
            >
            <a
              class="flex items-center gap-1.5 bg-orange-500 px-3 py-1.5 text-xs font-semibold text-white hover:bg-orange-600 rounded"
              href="#"
              >Current Affairs</a
            >
            <a
              href="#"
              class="flex items-center gap-1.5 border border-gray-300 bg-white px-3 py-1.5 text-xs font-semibold text-gray-700 hover:bg-gray-50 rounded"
              ><i class="fas fa-sparkles"></i> Explore Science Edge AI</a
            >
            <a
              href="#"
              class="flex items-center gap-1.5 bg-navy-900 px-3 py-1.5 text-xs font-semibold text-white hover:bg-[#0F2A40] rounded"
            >
              <span class="relative flex h-2 w-2 mr-0.5">
                <span
                  class="animate-ping absolute inline-flex h-full w-full rounded-sm bg-green-400 opacity-75"
                ></span>
                <span
                  class="relative inline-flex rounded-sm h-2 w-2 bg-green-500"
                ></span>
              </span>
              Online Courses
              <i class="fas fa-external-link-alt text-[10px]"></i>
            </a>
            <a
              href="#"
              class="flex items-center gap-1.5 bg-red-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-red-700 rounded-full"
            >
              <i class="fas fa-tree"></i> Forest Services
            </a>
          </div>
        </div>

        <div class="hidden items-center lg:flex gap-3">
          <div class="relative w-56">
            <i
              class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"
            ></i>
            <input
              type="text"
              placeholder="Search articles, topics..."
              class="w-full rounded border bg-gray-50 py-1.5 pl-8 pr-3 text-xs text-gray-700 placeholder-gray-400 outline-none border-gray-200 hover:border-gray-300"
            />
          </div>
          <button
            class="flex items-center gap-1 rounded border border-gray-200 bg-gray-50 px-2 py-1 text-[11px] font-semibold text-gray-700 hover:bg-white"
          >
            <i class="fas fa-globe text-gray-400"></i> EN
            <span class="text-gray-300">|</span>
            <span class="text-gray-400">हि</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="border-b border-gray-200 bg-white hidden md:block">
    <div class="max-w-7xl mx-auto px-4">
      <nav
        class="flex items-center justify-between py-3 text-[10.5px] font-bold uppercase tracking-wide text-gray-700"
      >
        <button class="flex items-center gap-1 hover:text-navy-900">
          UPSC <i class="fas fa-chevron-down text-[8px] opacity-60"></i>
        </button>
        <button class="flex items-center gap-1 hover:text-navy-900">
          UPSC NOTES <i class="fas fa-chevron-down text-[8px] opacity-60"></i>
        </button>
        <button class="flex items-center gap-1 hover:text-navy-900">
          STATE PSC <i class="fas fa-chevron-down text-[8px] opacity-60"></i>
        </button>
        <button class="flex items-center gap-1 hover:text-navy-900">
          OPTIONAL SUBJECTS
          <i class="fas fa-chevron-down text-[8px] opacity-60"></i>
        </button>
        <button class="flex items-center gap-1 hover:text-navy-900">
          <i class="far fa-folder-open text-sm mr-1"></i> FREE RESOURCES
          <i class="fas fa-chevron-down text-[8px] opacity-60"></i>
        </button>
        <a href="#" class="flex items-center gap-1 hover:text-navy-900"
          ><i class="fas fa-book-open text-sm mr-1"></i> PYQ PAPERS</a
        >
        <a href="#" class="flex items-center gap-1 hover:text-navy-900"
          ><i class="fas fa-pen-nib text-sm mr-1"></i> MAINS ANSWER WRITING</a
        >
        <button class="flex items-center gap-1 hover:text-navy-900">
          <i class="fas fa-clipboard-check text-sm mr-1"></i> TEST SERIES
          <i class="fas fa-chevron-down text-[8px] opacity-60"></i>
        </button>
      </nav>
    </div>
  </div>
</header>
